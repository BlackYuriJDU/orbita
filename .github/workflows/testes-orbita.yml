name: Testes do ÓRBITA

on:
  push:
    branches:
      - 'feat/orbita-identidade-visual-20261014'
    paths:
      - 'site/**'
      - '.github/workflows/testes-orbita.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/testes-orbita.yml'

permissions:
  contents: read

jobs:
  validar:
    name: Sintaxe e testes de lógica
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar sintaxe JavaScript
        working-directory: site
        run: |
          node --check app.js
          node --check efeitos.js
          node --check teste-sinal.js
          node --check seed.js

      - name: Executar testes da aplicação
        working-directory: site
        run: node teste-sinal.js
